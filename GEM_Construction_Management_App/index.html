    <script>
      // Suppress Vite HMR WebSocket connection closed notices in proxy preview environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || e.reason.message?.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
    </script>
